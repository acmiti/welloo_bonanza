        ta: {
            title: "Welloo ALWAYS දිනුම් Bonanza: விதிகளும் நிபந்தனைகளும்",
            sections: [
                { h: "1. தகுதி மற்றும் பதிவுகள்", items: [

                { h: "2. வாராந்த நேரலை குலுக்கல் மற்றும் பரிசுகள்", items: [
                    "ஒவ்வொரு வெள்ளிக்கிழமையும் மதியம் 3.00 மணிக்கு Welloo நிறுவனத்தின் அதிகாரப்பூர்வ Facebook பக்கத்தில் நேரலை மூலமாக டிஜிட்டல் சுழல் சக்கரம் (digital spin wheel) வழியாக வெற்றியாளர் தேர்ந்தெடுக்கப்படுவார். இது Bonanza பிரச்சாரம் நிறைவடையும் நாள் வரை தொடரும்.",
                    "ஒவ்வொரு வாரமும் ஒரு வெற்றியாளருக்கு Welloo 4-இன்ச் தொழில்முறை ஆங்கிள் கிரைண்டர் வழங்கப்படும்.",
                    "அந்தந்த வாரக் குலுக்கலில் பங்கேற்க ஒவ்வொரு வியாழக்கிழமையும் மதியம் 3.00 மணிக்கு முன் பதிவு செய்ய வேண்டும் (அந்த வாரத்தின் வெள்ளிக்கிழமை மதியம் 3.00 மணி குலுக்கலுக்காக). அதற்குப் பிறகு வரும் பதிவுகள் அடுத்த வாரக் குலுக்கலில் சேர்க்கப்படும். இந்த வாராந்த சுழற்சி Bonanza பிரச்சாரம் நிறைவடையும் நாள் வரை தொடரும்.",

                { h: "3. வெற்றி வாய்ப்புகளை அதிகரிப்பதற்கான வழிகள்", items: [

                { h: "4. தள்ளுபடி கூப்பன்களைப் பயன்படுத்துதல்", items: [

    function renderTerms(lang) {
        const data = termsData[lang] || termsData.si;
        document.documentElement.lang = lang;
        document.getElementById('page-title').innerText = data.title;
        document.getElementById('back-link').innerText = backLinkText[lang];

        const body = document.getElementById('terms-body');
        body.innerHTML = '';
        data.sections.forEach(section => {
            const h2 = document.createElement('h2');
            h2.innerText = section.h;
            body.appendChild(h2);

            const ul = document.createElement('ul');
            section.items.forEach(item => {
                if (Array.isArray(item)) {
                    const subUl = document.createElement('ul');
                    item.forEach(sub => {
                        const subLi = document.createElement('li');
                        subLi.innerText = sub;
                        subUl.appendChild(subLi);
                    });
                    ul.lastElementChild.appendChild(subUl);
                    return;
                }
                const li = document.createElement('li');
                li.innerText = item;
                ul.appendChild(li);
            });
            body.appendChild(ul);
        });
    }

    function setLang(lang, el) {
        document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
        if (el) {
            el.classList.add('active');
        } else {
            const idx = { si: 0, ta: 1, en: 2 }[lang] ?? 0;
            document.querySelectorAll('.lang-btn')[idx].classList.add('active');
        }
        renderTerms(lang);

        const url = new URL(window.location);
        url.searchParams.set('lang', lang);
        window.history.replaceState({}, '', url);

        document.getElementById('back-link').href = `index.html`;
    }

    document.addEventListener('DOMContentLoaded', function () {
        document.getElementById('year').innerText = new Date().getFullYear();
        const params = new URLSearchParams(window.location.search);
        let lang = params.get('lang');
        if (!['si', 'ta', 'en'].includes(lang)) lang = 'si';
        setLang(lang);
    });
</script>
